name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    permissions:
        id-token: write
        contents: read

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::017636909480:role/GitHubActions-Project2-Terraform
          aws-region: ap-south-1

      - name: Create Lambda deployment package
        working-directory: .
        run: |
          mkdir -p terraform/lambda
          zip -j terraform/lambda/recipe_api.zip lambda/recipe_api.py
          ls -l terraform/lambda/recipe_api.zip

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Python Syntax Check
        working-directory: .
        run: |
          python -m py_compile lambda/recipe_api.py

      - name: Terraform Plan
        run: terraform plan -lock=false